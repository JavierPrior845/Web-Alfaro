 <div class="galeria-container">
      
      <!-- Iteramos sobre el array de imágenes -->
      @for (imgSrc of images; track $index) {
        
        <!-- 
             Al hacer click, llamamos a openModal en lugar de solo emitir.
             Esto abre la imagen en grande.
        -->
        <div class="galeria-item" (click)="openModal(imgSrc)" role="button" tabindex="0">
          
          <img [src]="imgSrc" [alt]="extractTitle(imgSrc)">
          
          <div class="info-overlay">
            <h3>{{ extractTitle(imgSrc) }}</h3>
            <p>Ampliar imagen <i class="fas fa-search-plus"></i></p>
          </div>

        </div>
      }

      @if (images?.length === 0) {
        <p class="no-images">No hay imágenes disponibles.</p>
      }

    </div>

    <!-- 
      === NUEVO: LIGHTBOX / MODAL === 
      Solo se muestra si selectedImage tiene valor.
    -->
    @if (selectedImage) {
      <div class="lightbox-overlay" (click)="closeModal()">
        <!-- Botón de cierre -->
        <span class="close-btn">&times;</span>
        
        <!-- Imagen en grande (stopPropagation evita que se cierre al hacer click en la foto) -->
        <img 
          [src]="selectedImage" 
          class="lightbox-img" 
          (click)="$event.stopPropagation()"
          alt="Vista ampliada">
          
        <div class="lightbox-caption">{{ extractTitle(selectedImage) }}</div>
      </div>

    }
