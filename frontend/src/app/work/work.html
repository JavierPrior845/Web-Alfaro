<div class="works-list">
  @for (item of works; track item.obra) {
    <article>
      <div class="work-header-card">
        <h2>{{ item.obra }}</h2>
        <h3>{{ item.localizacion }}</h3>
      </div>

      @if (item.imagenes && item.imagenes.length > 0) {
        <div class="work-gallery">
          <app-masonry
            [items]="item.imagenes"
            [gap]="15"
            [animateFrom]="'bottom'">
          </app-masonry>
        </div>
      }
    </article>
  }
</div>
